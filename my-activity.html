<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Activity | KLU Arena</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><nav class="main-nav"><a href="index.html">Home</a><a href="tournaments.html">Tournaments</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="leaderboard.html">Leaderboard</a></nav></div></header><main><section class="page-hero"><div class="container"><p class="kicker">YOUR ARENA</p><h1>MY ACTIVITY</h1><p>Review your demo account, registrations, teams and support requests in one place.</p></div></section><section class="section"><div class="container"><div id="activity" class="activity-grid"></div></div></section></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 KLU Arena. All rights reserved.</span><span>Where Champions Compete.</span></div></footer><style>.activity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.activity-card{border:1px solid #29292d;background:#0d0d0f;border-radius:8px;padding:20px}.activity-card h2{font:800 26px var(--font-head);margin:0 0 10px}.activity-card p,.activity-card li{font-size:11px;color:#999}.activity-card ul{padding-left:18px}.activity-card a{margin-top:10px;display:inline-block}@media(max-width:650px){.activity-grid{grid-template-columns:1fr}}</style><script>const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};const box=document.getElementById('activity'),u=read('kluArenaActiveUser'),r=read('kluArenaRegistration'),t=read('kluArenaTeams')||[],s=read('kluArenaSupportTickets')||[];const card=(title,html)=>`<article class="activity-card"><h2>${title}</h2>${html}</article>`;box.innerHTML=card('ACCOUNT',u?`<p><strong>${u.name||'Arena Player'}</strong><br>${u.email||''}</p><a class="btn btn-outline" href="login.html">Account Login</a>`:`<p>You are not currently signed in.</p><a class="btn btn-primary" href="login.html">Login →</a>`)+card('REGISTRATION',r?`<p><strong>${r.team}</strong><br>${r.tournament}<br>Status: ${r.status||'Submitted'}</p><a class="btn btn-outline" href="tournaments.html">Browse Tournaments</a>`:`<p>No tournament registration found in this browser.</p><a class="btn btn-primary" href="register.html">Register →</a>`)+card('MY TEAMS',`<p>${t.length} team record${t.length===1?'':'s'} saved locally.</p>${t.length?'<ul>'+t.map(x=>`<li>${String(x.team).replace(/[&<>]/g,'')}</li>`).join('')+'</ul>':'<p>Create a verified squad to get started.</p>'}<a class="btn btn-outline" href="teams.html">Teams →</a>`)+card('SUPPORT',`<p>${s.length} support ticket${s.length===1?'':'s'} stored locally.</p>${s.length?'<ul>'+s.slice(-3).reverse().map(x=>`<li>${x.ticket||'KLU ticket'} — ${x.status||'Open'}</li>`).join('')+'</ul>':'<p>No support tickets yet.</p>'}<a class="btn btn-outline" href="contact.html">Contact Support →</a>`);</script></body></html>
