<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KLU Arena player activity dashboard."><title>My Activity | KLU Arena</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><button class="menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="tournaments.html">Tournaments</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="leaderboard.html">Leaderboard</a><a href="matches.html">Matches</a></nav><div class="nav-actions"><a class="btn btn-outline" href="login.html">Login</a></div></div></header><main><section class="page-hero"><div class="container"><p class="kicker">YOUR ARENA</p><h1>MY ACTIVITY</h1><p>Review your account, every tournament registration, teams and support requests in one place.</p></div></section><section class="section"><div class="container"><div id="activity" class="activity-grid"></div></div></section></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 KLU Arena. All rights reserved.</span><span>Where Champions Compete.</span></div></footer><style>.activity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.activity-card{border:1px solid #29292d;background:#0d0d0f;border-radius:8px;padding:20px}.activity-card h2{font:800 26px var(--font-head);margin:0 0 10px}.activity-card p,.activity-card li{font-size:11px;color:#999;line-height:1.6}.activity-card ul{padding-left:18px}.activity-card a{margin-top:10px;display:inline-block}.activity-status{display:inline-block;margin-top:6px;padding:5px 8px;border:1px solid #333;font-size:8px;font-weight:800;text-transform:uppercase}.activity-status.approved{color:#49dc8b}.activity-status.rejected{color:#ff6670}.activity-status.pending{color:#efb34a}.activity-list{display:grid;gap:9px}.activity-item{padding:10px;border-left:2px solid #ef3340;background:#09090b}.activity-item strong{display:block;color:#eee;font-size:11px}.activity-item span{display:block;color:#777;font-size:9px;margin-top:3px}@media(max-width:650px){.activity-grid{grid-template-columns:1fr}}</style><script src="js/script.js"></script><script>const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}};const esc=v=>String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const box=document.getElementById('activity'),u=read('kluArenaActiveUser',null),regs=read('kluArenaRegistrations',[]),legacy=read('kluArenaRegistration',null),t=read('kluArenaTeams',[]),s=read('kluArenaSupportTickets',[]),statuses=read('kluArenaOrganizerRegistrations',{});if(!regs.length&&legacy)regs.push(legacy);const myRegs=u?regs.filter(r=>!r.captain?.id||String(r.captain.id)===String(u.id)):regs.slice(-5);const card=(title,html)=>`<article class="activity-card"><h2>${title}</h2>${html}</article>`;const regHtml=myRegs.length?`<div class="activity-list">${myRegs.slice().reverse().map(r=>{const key=String(r.id||`${r.captain?.id}-${r.submittedAt}`),st=statuses[key]||r.status||'Submitted';return `<div class="activity-item"><strong>${esc(r.team||'Unnamed Team')}</strong><span>${esc(r.tournament||'Tournament')} • ${r.submittedAt?new Date(r.submittedAt).toLocaleDateString('en-IN'):''}</span><span class="activity-status ${st.toLowerCase()}">${esc(st)}</span></div>`}).join('')}</div><a class="btn btn-outline" href="tournaments.html">Browse Tournaments</a>`:`<p>No tournament registrations found for this account.</p><a class="btn btn-primary" href="register.html">Register →</a>`;box.innerHTML=card('ACCOUNT',u?`<p><strong>${esc(u.name||'Arena Player')}</strong><br>${esc(u.email||'')}<br>Student ID: ${esc(u.id||'—')}</p><a class="btn btn-outline" href="login.html">Account Login</a>`:`<p>You are not currently signed in.</p><a class="btn btn-primary" href="login.html">Login →</a>`)+card('MY REGISTRATIONS',regHtml)+card('MY TEAMS',`<p>${t.length} team record${t.length===1?'':'s'} saved locally.</p>${t.length?'<ul>'+t.map(x=>`<li>${esc(x.team||x.name||'Team')}</li>`).join('')+'</ul>':'<p>Create a verified squad to get started.</p>'}<a class="btn btn-outline" href="teams.html">Teams →</a>`)+card('SUPPORT',`<p>${s.length} support ticket${s.length===1?'':'s'} stored locally.</p>${s.length?'<ul>'+s.slice(-3).reverse().map(x=>`<li>${esc(x.ticket||'KLU ticket')} — ${esc(x.status||'Open')}</li>`).join('')+'</ul>':'<p>No support tickets yet.</p>'}<a class="btn btn-outline" href="contact.html">Contact Support →</a>`);</script></body></html>
