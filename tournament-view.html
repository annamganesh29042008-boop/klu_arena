<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Tournament details | KLU Arena"><title>Tournament | KLU Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a class="active" href="tournaments.html">Tournaments</a><a href="sports.html">Sports</a><a href="esports.html">Esports</a><a href="leaderboard.html">Leaderboard</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="organizer.html">Organizers</a></nav><div class="nav-actions"><a class="btn btn-outline" href="login.html">Login</a></div></div></header><main><section class="page-hero"><div class="container"><p class="kicker">TOURNAMENT PROFILE</p><h1 id="title">TOURNAMENT</h1><p id="subtitle">Competition details, schedule and registration.</p></div></section><section class="section"><div class="container"><div id="content"></div></div></section></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 KLU Arena. All rights reserved.</span><span>Where Champions Compete.</span></div></footer><div class="toast" id="toast"></div><style>.view-hero{display:grid;grid-template-columns:1fr auto;gap:20px;padding:25px;border:1px solid #29292d;border-radius:9px;background:radial-gradient(circle at 90% 20%,rgba(229,9,20,.18),transparent 32%),#0d0d0f}.view-hero h2{font:900 46px/.95 var(--font-head);font-style:italic;margin:5px 0 12px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:7px 9px;border:1px solid #333;border-radius:5px;font-size:9px;color:#bbb}.tag.red{color:#55df93;border-color:#1e5c3d}.view-icon{width:120px;height:120px;display:grid;place-items:center;border:1px solid #482026;background:#13090b;font-size:48px}.view-grid{display:grid;grid-template-columns:1.5fr .7fr;gap:15px;margin-top:15px}.view-card{padding:20px;border:1px solid #29292d;border-radius:8px;background:#0d0d0f}.view-card h3{font:800 24px var(--font-head);margin:0 0 12px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{padding:13px;border:1px solid #222;background:#09090b}.fact span{display:block;color:#666;font-size:8px}.fact strong{display:block;margin-top:4px;font:700 16px var(--font-head)}.empty-view{text-align:center;padding:45px;border:1px solid #29292d;background:#0d0d0f}.empty-view h2{font:800 32px var(--font-head)}@media(max-width:750px){.view-grid{grid-template-columns:1fr}.view-hero{grid-template-columns:1fr}.view-icon{display:none}.facts{grid-template-columns:1fr}}</style><script src="js/script.js"></script><script>(()=>{const esc=v=>String(v).replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));let list=[];try{list=JSON.parse(localStorage.getItem('kluArenaOrganizerTournaments')||'[]')}catch{}const name=new URLSearchParams(location.search).get('tournament');const t=list.find(x=>x.name===name);const content=document.getElementById('content');if(!t){document.getElementById('title').textContent='TOURNAMENT NOT FOUND';document.getElementById('subtitle').textContent='The organizer-created tournament may have been removed or the link is invalid.';content.innerHTML='<div class="empty-view"><h2>No tournament data</h2><p>Return to the tournament list and choose an available event.</p><a class="btn btn-primary" href="tournaments.html">Browse Tournaments →</a></div>'}else{document.title=`${t.name} | KLU Arena`;document.getElementById('title').textContent=t.name.toUpperCase();document.getElementById('subtitle').textContent=`${t.game} • ${t.type||'Sports'} • Organizer published event`;content.innerHTML=`<section class="view-hero"><div><p class="kicker">${esc(t.type||'SPORTS')} COMPETITION</p><h2>${esc(t.name)}</h2><div class="tags"><span class="tag">${esc(t.game)}</span><span class="tag">${esc(t.format||'Tournament')}</span><span class="tag red">REGISTRATION OPEN</span></div></div><div class="view-icon">🏆</div></section><div class="view-grid"><article class="view-card"><h3>EVENT OVERVIEW</h3><p>This tournament was published by a KLU Arena organizer. Use the registration flow to submit your verified squad.</p><div class="facts"><div class="fact"><span>START DATE</span><strong>${esc(t.date||'TBA')}</strong></div><div class="fact"><span>FORMAT</span><strong>${esc(t.format||'Tournament')}</strong></div><div class="fact"><span>GAME / SPORT</span><strong>${esc(t.game)}</strong></div><div class="fact"><span>PRIZE POOL</span><strong>₹${Number(t.prize||0).toLocaleString('en-IN')}</strong></div></div></article><aside class="view-card"><h3>READY?</h3><p>Register your verified team for this event.</p><a class="btn btn-primary btn-lg" href="register.html">Register Now →</a><a class="btn btn-outline" href="matches.html">View Matches</a></aside></div>`}})();</script></body></html>
