<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Team | KLU Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body class="auth-body"><main class="auth-page"><a class="brand auth-brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><section class="auth-card" style="width:min(650px,100%)"><div class="auth-copy"><p class="kicker">BUILD YOUR SQUAD</p><h1>CREATE A <span>TEAM.</span></h1><p>Set up your squad and save its details locally for this project demo.</p></div><form id="teamForm"><div class="form-grid"><div class="form-group"><label>Team Name<input required name="team" placeholder="e.g. Red Warriors"></label></div><div class="form-group"><label>Category<select required name="category"><option>Sports</option><option>Esports</option></select></label></div><div class="form-group"><label>Sport / Game<input required name="game" placeholder="Cricket / Valorant"></label></div><div class="form-group"><label>Captain<input required name="captain" placeholder="Captain name"></label></div></div><div class="form-group"><label>Team Members<textarea required name="members" placeholder="One member per line"></textarea></label></div><div class="form-actions"><button class="btn btn-primary btn-lg" type="submit">Create Team →</button><a class="btn btn-outline btn-lg" href="teams.html">Cancel</a></div><div class="success-box" id="success">Team created successfully in this demo. You can now use the team details during registration.</div></form></section></main><div class="toast" id="toast"></div><script src="js/script.js"></script><script>document.querySelector('#teamForm')?.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));localStorage.setItem('kluArenaTeam',JSON.stringify({...data,createdAt:new Date().toISOString()}));document.querySelector('#success').classList.add('show');showToast('Team created successfully.');});</script></body></html>
