<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register Tournament | KLU Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><main class="auth-page"><a class="brand auth-brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><section class="auth-card" style="width:min(720px,100%)"><div class="auth-copy"><p class="kicker">TOURNAMENT ENTRY</p><h1>JOIN THE <span>ARENA.</span></h1><p>Register your team for the selected tournament. This demo stores your submission locally in this browser.</p></div><form id="registrationForm"><div class="form-grid"><div class="form-group"><label>Captain Name<input name="captain" required placeholder="Team captain"></label></div><div class="form-group"><label>Student ID<input name="student" required placeholder="KLU student ID"></label></div><div class="form-group"><label>Email<input type="email" name="email" required placeholder="you@klu.edu.in"></label></div><div class="form-group"><label>Phone<input type="tel" name="phone" required placeholder="10-digit mobile number"></label></div><div class="form-group"><label>Tournament<select name="tournament"><option>KLU Cricket Cup</option><option>Valorant Championship</option><option>BGMI Showdown</option><option>KLU Football League</option><option>Table Tennis Open</option></select></label></div><div class="form-group"><label>Team Name<input name="team" required placeholder="Your team name"></label></div></div><div class="form-group"><label>Players / Members<textarea name="members" required placeholder="Enter player names, one per line"></textarea></label></div><label class="checkline"><input type="checkbox" required> I confirm the information is accurate and I agree to the tournament rules.</label><div class="form-actions" style="margin-top:16px"><button class="btn btn-primary btn-lg" type="submit">Submit Registration →</button><a class="btn btn-outline btn-lg" href="tournaments.html">Back to Tournaments</a></div><div class="success-box" id="success">Registration submitted successfully. Your entry has been saved for this demo.</div></form></section></main><div class="toast" id="toast"></div><script src="js/script.js"></script><script>document.querySelector('#registrationForm')?.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));localStorage.setItem('kluArenaRegistration',JSON.stringify({...data,submittedAt:new Date().toISOString()}));document.querySelector('#success').classList.add('show');e.target.reset();showToast('Registration submitted successfully.');});</script></body></html>
