<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Teams | KLU Arena</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><nav class="main-nav"><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="leaderboard.html">Leaderboard</a></nav></div></header><main><section class="page-hero"><div class="container"><p class="kicker">HEAD TO HEAD</p><h1>COMPARE TEAMS</h1><p>Compare featured squads by matches, wins, points and win rate.</p></div></section><section class="section"><div class="container"><div class="compare-tools"><select id="a"></select><span>VS</span><select id="b"></select></div><div id="comparison"></div></div></section></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 KLU Arena. All rights reserved.</span><span>Where Champions Compete.</span></div></footer><style>.compare-tools{display:flex;gap:12px;align-items:center;margin-bottom:18px}.compare-tools select{flex:1;background:#101012;border:1px solid #29292d;color:#fff;padding:13px;border-radius:6px}.compare-tools span{font:900 22px var(--font-head);color:#e50914}.compare-card{display:grid;grid-template-columns:1fr 1fr;border:1px solid #29292d;border-radius:8px;overflow:hidden;background:#0d0d0f}.compare-team{padding:25px;text-align:center}.compare-team:first-child{border-right:1px solid #29292d}.compare-team h2{font:900 34px var(--font-head);margin:0 0 8px}.compare-team p{color:#777;font-size:10px}.metric{display:flex;justify-content:space-between;border-top:1px solid #202023;padding:11px 0;font-size:11px}.metric strong{color:#f13e48}@media(max-width:600px){.compare-tools{flex-wrap:wrap}.compare-tools select{width:100%;flex-basis:100%}.compare-tools span{width:100%;text-align:center}.compare-card{grid-template-columns:1fr}.compare-team:first-child{border-right:0;border-bottom:1px solid #29292d}}</style><script>const teams=[['Team Alpha','Valorant','20','18','2150','90'],['4King Esports','BGMI','18','15','1890','83.3'],['Strikers FC','Football','16','12','1480','75'],['Team Titans','Cricket','14','10','1320','71.4'],['Red Warriors','CS2','15','9','1180','60'],['Royal Kings','Badminton','13','8','1055','61.5']];const a=document.getElementById('a'),b=document.getElementById('b'),cmp=document.getElementById('comparison');teams.forEach((t,i)=>{[a,b].forEach(s=>{const o=document.createElement('option');o.value=i;o.textContent=t[0];s.appendChild(o)});});b.value='1';function render(){const x=teams[a.value],y=teams[b.value];cmp.innerHTML=`<div class="compare-card">${[x,y].map(t=>`<div class="compare-team"><h2>${t[0]}</h2><p>${t[1]}</p><div class="metric"><span>Matches</span><strong>${t[2]}</strong></div><div class="metric"><span>Wins</span><strong>${t[3]}</strong></div><div class="metric"><span>Points</span><strong>${t[4]}</strong></div><div class="metric"><span>Win Rate</span><strong>${t[5]}%</strong></div></div>`).join('')}</div>`}a.onchange=render;b.onchange=render;render();</script></body></html>
