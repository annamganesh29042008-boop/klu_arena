<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Leaderboard | KLU Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="tournaments.html">Tournaments</a><a href="sports.html">Sports</a><a href="esports.html">Esports</a><a class="active" href="leaderboard.html">Leaderboard</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="organizer.html">Organizers</a></nav><div class="nav-actions"><button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button><a class="btn btn-outline" href="login.html">Login</a><a class="btn btn-primary" href="signup.html">Sign Up</a></div></div></header><main><section class="page-hero"><div class="container"><p class="kicker">CLIMB THE RANKS</p><h1>LEADERBOARD</h1><p>Track the top teams and players across KLU Arena.</p></div></section><section class="section"><div class="container"><div class="leader-tabs"><button class="active" data-type="teams">Teams</button><button data-type="players">Players</button></div><div class="leader-filter"><button class="active" data-category="All">All</button><button data-category="Sports">Sports</button><button data-category="Esports">Esports</button><input id="leaderSearch" type="search" placeholder="Search rankings..." aria-label="Search rankings"><select id="leaderSort"><option value="points">Highest Points</option><option value="wins">Most Wins</option><option value="rate">Best Win Rate</option></select></div><div id="leaderboardFull" class="leaderboard-full"></div><div id="leaderEmpty" class="leader-empty">No rankings found.</div></div></section></main><footer class="site-footer"><div class="container footer-bottom"><span>© 2026 KLU Arena. All rights reserved.</span><span>Where Champions Compete.</span></div></footer><style>.leader-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid #28282c}.leader-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:#777;padding:11px 18px;font:800 18px var(--font-head);cursor:pointer}.leader-tabs button.active{color:#fff;border-bottom-color:#e50914}.leader-filter{display:flex;gap:8px;margin-bottom:18px;align-items:center}.leader-filter button,.leader-filter select,.leader-filter input{background:#101012;border:1px solid #28282c;color:#cfcfd3;padding:10px 13px;border-radius:5px;font-size:10px}.leader-filter button{cursor:pointer}.leader-filter button.active{background:#d90914;color:#fff;border-color:#d90914}.leader-filter input{margin-left:auto;width:220px}.leader-filter select{width:145px}.leaderboard-full{border:1px solid #27272b;border-radius:8px;overflow:hidden;background:#0c0c0e}.full-row{display:grid;grid-template-columns:70px 1.8fr 110px 90px 80px 100px;gap:10px;align-items:center;padding:17px 20px;border-top:1px solid #202023;font-size:11px;color:#a9a9ae}.full-row.header{border-top:0;color:#66666d;font-size:8px;text-transform:uppercase;letter-spacing:1px}.full-row a{color:#eee;text-decoration:none}.full-row a:hover{color:#f13e48}.full-row span strong{display:block}.full-row span small{display:block;color:#6d6d73;font-size:8px;margin-top:2px}.place{font:800 23px var(--font-head);font-style:italic;color:#eee}.points{color:#f13e48}.badge{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:#888}.custom-rank{border-left:2px solid #5b2026}.leader-empty{display:none;text-align:center;padding:40px;color:#777;border:1px solid #27272b;border-radius:8px;background:#0c0c0e}.leader-empty.show{display:block}.leaderboard-full.hidden{display:none}@media(max-width:700px){.leader-filter{flex-wrap:wrap}.leader-filter input{margin-left:0;width:100%}.leader-filter select{width:100%}.leaderboard-full{overflow-x:auto}.full-row{min-width:560px;grid-template-columns:45px 1.8fr 75px 65px 55px 70px;padding:14px 10px;font-size:9px}.leader-tabs button{font-size:16px}}</style><script src="js/players.js"></script><script src="js/script.js"></script><script>(()=>{const teams=[{name:'Team Alpha',captain:'Arjun',category:'Esports',game:'Valorant',matches:20,wins:18,points:2150,rate:90,slug:'team-alpha'},{name:'4King Esports',captain:'Rahul',category:'Esports',game:'BGMI',matches:18,wins:15,points:1890,rate:83.3,slug:'4king-esports'},{name:'Strikers FC',captain:'Kiran',category:'Sports',game:'Football',matches:16,wins:12,points:1480,rate:75,slug:'strikers-fc'},{name:'Team Titans',captain:'Vikram',category:'Sports',game:'Cricket',matches:14,wins:10,points:1320,rate:71.4,slug:'team-titans'},{name:'Red Warriors',captain:'Dev',category:'Esports',game:'CS2',matches:15,wins:9,points:1180,rate:60,slug:'red-warriors'},{name:'Royal Kings',captain:'Sandeep',category:'Sports',game:'Badminton',matches:13,wins:8,points:1055,rate:61.5,slug:'royal-kings'}];
function loadCreatedTeams(){let created=[];try{created=JSON.parse(localStorage.getItem('kluArenaTeams')||'[]');}catch{}if(!Array.isArray(created))return [];return created.filter(t=>t&&t.team).map(t=>({name:String(t.team),captain:(t.members||[]).find(m=>String(m.id)===String(t.captainId))?.name||'Verified Captain',category:String(t.category||'Team').replace(/^./,c=>c.toUpperCase()),game:t.game||'Competitive Game',matches:0,wins:0,points:0,rate:0,slug:String(t.team).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),custom:true}));}
const playerCategory=p=>['Cricket','Football','Badminton'].includes(p.game)?'Sports':'Esports';const playerPoints=p=>Number.isFinite(Number(p.points))?Number(p.points):Number(p.rating)||0;let type='teams',category='All';const root=document.querySelector('#leaderboardFull'),empty=document.querySelector('#leaderEmpty'),search=document.querySelector('#leaderSearch'),sort=document.querySelector('#leaderSort');const render=()=>{let data=type==='teams'?[...teams,...loadCreatedTeams()]:(window.KLUPlayers||[]).map(p=>({...p,category:playerCategory(p),name:p.name,slug:p.username,rate:Number(p.winRate)||0,points:playerPoints(p)}));const q=search.value.toLowerCase().trim();data=data.filter(x=>(category==='All'||x.category===category)&&(!q||`${x.name} ${x.game} ${x.captain||x.username||''}`.toLowerCase().includes(q)));const key=sort.value;data.sort((a,b)=>Number(b[key]||0)-Number(a[key]||0));root.innerHTML='<div class="full-row header"><span>Rank</span><span>Team / Player</span><span>Type</span><span>Matches</span><span>Wins</span><span>Points</span></div>'+data.map((x,i)=>`<div class="full-row${x.custom?' custom-rank':''}"><b class="place">${String(i+1).padStart(2,'0')}</b><span><a href="${type==='teams'?`team-profile.html?team=${encodeURIComponent(x.slug)}`:`player-profile.html?player=${encodeURIComponent(x.username)}`}"><strong>${x.name}</strong></a><small>${type==='teams'?`Captain: ${x.captain}${x.custom?' • Newly Created':''}`:`${x.username} • ${x.rank}`}</small></span><span class="badge">${x.category} • ${x.game}</span><span>${x.matches}</span><span>${x.wins}</span><strong class="points">${x.points}</strong></div>`).join('');root.classList.toggle('hidden',!data.length);empty.classList.toggle('show',!data.length);};document.querySelectorAll('.leader-tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.leader-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;render();}));document.querySelectorAll('.leader-filter button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.leader-filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.category;render();}));search.addEventListener('input',render);sort.addEventListener('change',render);render();})();</script></body></html>
