<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password | KLU Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body class="auth-body"><main class="auth-page"><a class="brand auth-brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><section class="auth-card"><div class="auth-copy"><p class="kicker">ACCOUNT RECOVERY</p><h1>RESET <span>PASSWORD.</span></h1><p>For this front-end demo, you can reset the password for an account stored in this browser.</p></div><form id="resetForm"><label>Email / Student ID<input id="resetId" required autocomplete="username" placeholder="you@klu.edu.in"></label><label>New Password<input id="resetPassword" required type="password" minlength="6" autocomplete="new-password" placeholder="Minimum 6 characters"></label><label>Confirm Password<input id="resetConfirm" required type="password" minlength="6" autocomplete="new-password" placeholder="Re-enter password"></label><p class="auth-error" id="resetError" role="alert"></p><div class="success-box" id="success">Password updated. You can now log in with the new password.</div><button class="btn btn-primary btn-lg" type="submit">Reset Password →</button></form><p class="auth-bottom" style="margin-top:20px"><a href="login.html">← Back to Login</a></p></section></main><div class="toast" id="toast"></div><style>.auth-body{min-height:100vh;background:radial-gradient(circle at 15% 30%,rgba(229,9,20,.18),transparent 24%),radial-gradient(circle at 85% 70%,rgba(229,9,20,.1),transparent 25%),#050505}.auth-page{min-height:100vh;display:grid;place-items:center;padding:30px}.auth-brand{position:absolute;top:30px;left:35px}.auth-card{width:min(470px,100%);padding:34px;border:1px solid #333338;border-radius:10px;background:rgba(12,12,14,.94);box-shadow:0 30px 90px rgba(0,0,0,.45)}.auth-copy h1{font:900 51px/.9 var(--font-head);font-style:italic;margin:8px 0 10px}.auth-copy h1 span{color:#ef313b}.auth-copy>p:last-child{color:#92929a;font-size:11px}.auth-card form{margin-top:23px}.auth-card label{display:block;color:#aaa;font-size:10px;margin-bottom:13px}.auth-card input{display:block;width:100%;margin-top:6px;background:#08080a;border:1px solid #29292e;border-radius:5px;color:#fff;padding:12px}.auth-card form>button{width:100%;margin-top:8px}.auth-bottom{text-align:center;color:#777;font-size:10px}.auth-bottom a{color:#ef434c}.auth-error{min-height:16px;margin:0 0 6px;color:#ff6670;font-size:10px}.success-box{display:none;margin:8px 0 14px;padding:12px;border:1px solid #304630;background:#101610;color:#9bd19b;font-size:10px}.success-box.show{display:block}.auth-card button:disabled{opacity:.65;cursor:wait}@media(max-width:600px){.auth-brand{position:static;margin-bottom:80px}.auth-page{display:block;padding-top:80px}.auth-card{margin:auto}}</style><script src="js/script.js"></script><script src="js/auth.js"></script><script>(async()=>{const form=document.querySelector('#resetForm');if(!form)return;form.addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#resetError');const success=document.querySelector('#success');const button=form.querySelector('button');const password=document.querySelector('#resetPassword').value;const confirm=document.querySelector('#resetConfirm').value;error.textContent='';success.classList.remove('show');if(password!==confirm){error.textContent='Passwords do not match.';return;}button.disabled=true;try{await KLUArenaAuth.resetPassword(document.querySelector('#resetId').value,password);success.classList.add('show');showToast('Password updated successfully.');form.reset();}catch(err){error.textContent=err.message;}finally{button.disabled=false;}});})();</script></body></html>
