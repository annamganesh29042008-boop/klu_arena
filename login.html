<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | KLU Arena</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body class="auth-body"><main class="auth-page"><a class="brand auth-brand" href="index.html"><div class="brand-mark"><span>K</span><b>A</b></div><div class="brand-copy"><strong><span>KLU</span> ARENA</strong><small>WHERE CHAMPIONS COMPETE</small></div></a><section class="auth-card"><div class="auth-copy"><p class="kicker">WELCOME BACK</p><h1>ENTER THE <span>ARENA.</span></h1><p>Log in to register for tournaments, manage your team and track your competition journey.</p></div><form id="loginForm"><label>Email / Student ID<input id="loginId" type="text" required placeholder="you@klu.edu.in"></label><label>Password<input type="password" required placeholder="••••••••"></label><div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="forgot-password.html">Forgot password?</a></div><button class="btn btn-primary btn-lg" type="submit">Login to KLU Arena →</button></form><div class="auth-divider"><span>OR</span></div><p class="auth-bottom">New to KLU Arena? <a href="signup.html">Create an account</a></p></section></main><div class="toast" id="toast"></div><style>.auth-body{min-height:100vh;background:radial-gradient(circle at 15% 30%,rgba(229,9,20,.18),transparent 24%),radial-gradient(circle at 85% 70%,rgba(229,9,20,.1),transparent 25%),#050505}.auth-page{min-height:100vh;display:grid;place-items:center;padding:30px}.auth-brand{position:absolute;top:30px;left:35px}.auth-card{width:min(470px,100%);padding:34px;border:1px solid #333338;border-radius:10px;background:rgba(12,12,14,.94);box-shadow:0 30px 90px rgba(0,0,0,.45)}.auth-copy h1{font:900 51px/.9 var(--font-head);font-style:italic;margin:8px 0 10px}.auth-copy h1 span{color:#ef313b}.auth-copy>p:last-child{color:#92929a;font-size:11px}.auth-card form{margin-top:25px}.auth-card label{display:block;color:#aaa;font-size:10px;margin-bottom:14px}.auth-card input:not([type=checkbox]){display:block;width:100%;margin-top:6px;background:#08080a;border:1px solid #29292e;border-radius:5px;color:#fff;padding:12px}.form-row{display:flex;justify-content:space-between;align-items:center;margin:3px 0 18px}.form-row a,.auth-bottom a{color:#ef434c}.check{display:flex!important;align-items:center;gap:7px}.check input{width:auto!important}.auth-card form>button{width:100%}.auth-divider{margin:23px 0;border-top:1px solid #222;position:relative;text-align:center}.auth-divider span{position:relative;top:-9px;background:#0c0c0e;padding:0 10px;color:#555;font-size:9px}.auth-bottom{text-align:center;color:#777;font-size:10px}@media(max-width:600px){.auth-brand{position:static;margin-bottom:80px}.auth-page{display:block;padding-top:80px}.auth-card{margin:auto}}</style><script>document.querySelector('#loginForm')?.addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('kluArenaLoggedIn','true');const id=document.querySelector('#loginId').value.trim();localStorage.setItem('kluArenaLoginId',id);showToast('Login successful. Welcome to the arena.');const next=new URLSearchParams(location.search).get('next');setTimeout(()=>location.href=next==='register'?'register.html':'index.html',700)});</script><script src="js/script.js"></script></body></html>
